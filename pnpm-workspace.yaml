packages:
  - "docs"
  - "apps/lumi-dashboard"
  - "packages/*"

minimumReleaseAge: 4320
blockExoticSubdeps: true

# Force patched versions of transitive deps with high-severity advisories.
# All are dashboard-only transitive deps; none reach @navikt/lumi-survey.
# tmp <0.2.6: Path Traversal (GHSA-ph9p-34f9-6g65), via lumi-dashboard>exceljs>tmp
# vite 7.0.0-7.3.4: server.fs.deny bypass, via lumi-dashboard>@tanstack/react-start>...>vite
# undici <7.28.0: TLS bypass / WebSocket DoS / cross-origin routing, via cheerio + nitro
overrides:
  tmp: "^0.2.6"
  vite: "^7.3.5"
  undici: "^7.28.0"

allowBuilds:
  esbuild: true
