name: Tilgangsforespørsel
description: Be om tilgang til å sende feedback til Lumi API
title: "[Tilgang]: "
labels: ["access-request"]
projects: ["navikt/157"]
body:
  - type: input
    id: app-name
    attributes:
      label: Applikasjonsnavn
      description: Navnet på appen som trenger tilgang
      placeholder: "f.eks. min-frontend"
    validations:
      required: true
  - type: input
    id: namespace
    attributes:
      label: Namespace (team)
      description: NAIS-namespacet appen kjører i
      placeholder: "f.eks. mitt-team"
    validations:
      required: true
  - type: dropdown
    id: auth-type
    attributes:
      label: Auth-type
      description: Hvilken autentiseringsmekanisme bruker appen?
      options:
        - TokenX (sluttbrukerflater — nav.no, arbeidsgiver, privatperson)
        - AzureAD (interne flater — Modia, veiledersystemer, fagsystemer)
    validations:
      required: true
  - type: checkboxes
    id: environments
    attributes:
      label: Miljø
      description: Hvilke miljøer trenger tilgang?
      options:
        - label: dev-gcp
          required: true
        - label: prod-gcp
  - type: markdown
    attributes:
      value: |
        ### Husk før deploy
        Du må legge til `lumi-api` (namespace: `team-esyfo`) som **outbound** i appens `nais.yaml` før du deployer:
        ```yaml
        spec:
          accessPolicy:
            outbound:
              rules:
                - application: lumi-api
                  namespace: team-esyfo
        ```
  - type: textarea
    id: context
    attributes:
      label: Tilleggsinformasjon
      description: Eventuell ekstra kontekst om bruksområdet
    validations:
      required: false
