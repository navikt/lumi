name: Tilgangsforespørsel
description: Be om tilgang til å sende feedback til Lumi
title: "[Tilgang] <app-navn> (<team>)"
labels: ["access-request"]
projects: ["navikt/157"]
body:
  - type: markdown
    attributes:
      value: |
        Vi gir appen din inbound-tilgang i både dev og prod, slik at den kan sende inn feedback. Resten av oppsettet står i [integrasjonsguiden](https://navikt.github.io/lumi/kom-i-gang/koble-til-backend).

        Vet du hvilken mottaker du skal ha? Da går det raskere å [sende en PR selv](https://navikt.github.io/lumi/kom-i-gang/koble-til-backend#send-pr-selv).
  - type: input
    id: app-name
    attributes:
      label: Applikasjonsnavn
      placeholder: "f.eks. min-frontend"
    validations:
      required: true
  - type: input
    id: namespace
    attributes:
      label: Namespace (team)
      placeholder: "f.eks. mitt-team"
    validations:
      required: true
  - type: dropdown
    id: auth-type
    attributes:
      label: Autentisering
      options:
        - TokenX (sluttbrukerflater)
        - Entra ID (interne flater for ansatte)
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Noe mer vi bør vite?
    validations:
      required: false
