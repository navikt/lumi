name: Ønske eller forslag
description: Foreslå noe nytt eller en forbedring i Lumi
type: Feature
projects: ["navikt/157"]
body:
  - type: markdown
    attributes:
      value: |
        Alle ønsker er velkomne – store og små. Det holder med et par setninger.

        **Repoet er offentlig.** Ikke lim inn surveysvar, personopplysninger eller interne data.
  - type: textarea
    id: wish
    attributes:
      label: Hva ønsker du?
    validations:
      required: true
  - type: textarea
    id: need
    attributes:
      label: Hvorfor?
      description: Hvilket behov eller problem løser det for teamet ditt eller brukerne?
    validations:
      required: false
