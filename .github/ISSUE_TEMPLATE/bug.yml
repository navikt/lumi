name: Meld fra om feil
description: Meld fra om en feil i widgeten, dashboardet, Surveyverkstedet eller innsendingen
type: Bug
projects: ["navikt/157"]
body:
  - type: markdown
    attributes:
      value: |
        Takk for at du sier fra! Det holder med en kort beskrivelse – vi spør hvis vi trenger mer.

        **Repoet er offentlig.** Ikke lim inn surveysvar, personopplysninger, fødselsnummer, tokens eller skjermbilder med slike data.
  - type: textarea
    id: description
    attributes:
      label: Hva skjedde?
      description: Beskriv hva som ikke virker
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Hvor oppstod feilen?
      options:
        - Surveyen i en app (widgeten)
        - Innsending av svar
        - Dashboardet
        - Surveyverkstedet
        - Dokumentasjonen
        - Vet ikke
    validations:
      required: false
  - type: input
    id: app-and-environment
    attributes:
      label: App og miljø
      placeholder: "f.eks. min-frontend i dev-gcp"
    validations:
      required: false
  - type: textarea
    id: expected-behavior
    attributes:
      label: Hva forventet du?
    validations:
      required: false
  - type: textarea
    id: technical-context
    attributes:
      label: Teknisk kontekst
      description: Steg for å reprodusere, feilmelding, HTTP-status, pakkeversjon e.l.
    validations:
      required: false
