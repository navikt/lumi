version: 2
registries:
  # One entry per scope. Without `scope`, Dependabot infers scopes from where
  # it found each package. GitHub Packages also serves public packages such as
  # @types/*, so Dependabot sent those scopes there too, got stale metadata and
  # failed every root npm update after the move to pnpm.
  github-npm-navikt:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@navikt"
    token: ${{ secrets.READER_TOKEN }}
  github-npm-nais:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@nais"
    token: ${{ secrets.READER_TOKEN }}
updates:
  # Root workspace packages, docs included, are managed by pnpm from the
  # repository root.
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - github-npm-navikt
      - github-npm-nais
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "zod"
        versions: [">=4"]
      # tsup builds the type declarations with rollup-plugin-dts, which reads
      # ts.sys from the TypeScript API. TypeScript 7 does not have it, so both
      # package builds fail.
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      # react-dom refuses to run with another react version ("Incompatible
      # React versions"), and the dashboard then answers 500 on every page.
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      # @tanstack/react-start pins exact router versions. Updating the router
      # alone installs a second router-core and breaks the route types. Start
      # 1.169 and the routers released with it require Vite 8, so the group
      # update needs that migration before it can pass.
      tanstack-router:
        patterns:
          - "@tanstack/react-router"
          - "@tanstack/react-start"
          - "@tanstack/router-*"
          - "@tanstack/start-*"
          - "@tanstack/history"
          - "@tanstack/zod-adapter"
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      navikt:
        patterns:
          - "@navikt/*"
  - package-ecosystem: "gradle"
    directory: "/apps/lumi-api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # CodeQL supports Kotlin < 2.2.30; keep Kotlin pinned until support lands.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [">=2.2.30"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [">=2.2.30"]
  - package-ecosystem: "gradle"
    directory: "/apps/lumi-submission-proxy"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # CodeQL supports Kotlin < 2.2.30; keep Kotlin pinned until support lands.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [">=2.2.30"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [">=2.2.30"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
