version: 2
registries:
  github-npm:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{ secrets.READER_TOKEN }}
updates:
  - package-ecosystem: "npm"
    directory: "/"
    registries:
      - github-npm
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      storybook:
        patterns:
          - "storybook"
          - "@storybook/*"
      testing-library:
        patterns:
          - "@testing-library/*"
      navikt:
        patterns:
          - "@navikt/*"
  - package-ecosystem: "gradle"
    directory: "/apps/lumi-api"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    ignore:
      # CodeQL supports Kotlin < 2.2.30; keep Kotlin pinned until support lands.
      - dependency-name: "org.jetbrains.kotlin.jvm"
        versions: [">=2.2.30"]
      - dependency-name: "org.jetbrains.kotlin.plugin.serialization"
        versions: [">=2.2.30"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
