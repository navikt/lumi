name: Deploy API

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        required: true
        options:
          - dev
          - prod
      ref:
        description: Git ref to deploy (branch/tag/sha). Defaults to the ref you run the workflow from.
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true

      - name: Build with Gradle
        working-directory: apps/lumi-api
        run: ./gradlew shadowJar

      - name: Push docker image to GAR
        uses: nais/docker-build-push@be85229e81c0293c265c646c084f05317fb6e0d2
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/lumi-api/Dockerfile
          docker_context: apps/lumi-api
          image_suffix: api
          push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  deploy-dev:
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-api/nais/app/dev.yaml
          VAR: image=${{ needs.build.outputs.image }}

  deploy-prod:
    if: |
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/lumi-api/nais/app/prod.yaml
          VAR: image=${{ needs.build.outputs.image }}
