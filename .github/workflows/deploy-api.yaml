name: Deploy API

on:
  push:
    branches:
      - main
    paths:
      - 'apps/lumi-api/**'
  pull_request:
    paths:
      - 'apps/lumi-api/**'
      - '.github/workflows/deploy-api.yaml'
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        required: true
        options:
          - dev
          - prod
      ref:
        description: Git ref to deploy (branch/tag/sha). Defaults to the ref you run the workflow from.
        type: string
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref || github.sha }}

      - name: Determine whether the workload image changed
        if: github.event_name != 'workflow_dispatch'
        id: what-changed
        uses: nais/what-changed@e253615426610a2e873ada19749ca58896f3679f
        with:
          # List every input that can change app.jar or the production container.
          # Using image inputs (rather than manifests) avoids false rebuilds from
          # unrelated commits between path-filtered workflow runs in this monorepo.
          files: >-
            .github/workflows/deploy-api.yaml,
            apps/lumi-api/Dockerfile,
            apps/lumi-api/build.gradle.kts,
            apps/lumi-api/gradle.properties,
            apps/lumi-api/gradle/**,
            apps/lumi-api/gradlew,
            apps/lumi-api/gradlew.bat,
            apps/lumi-api/settings.gradle.kts,
            apps/lumi-api/src/main/**

      - name: Setup Java
        if: github.event_name == 'workflow_dispatch' || steps.what-changed.outputs.changed != 'non-inputs'
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        if: github.event_name == 'workflow_dispatch' || steps.what-changed.outputs.changed != 'non-inputs'
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true

      - name: Build with Gradle
        if: github.event_name == 'workflow_dispatch' || steps.what-changed.outputs.changed != 'non-inputs'
        working-directory: apps/lumi-api
        run: ./gradlew shadowJar

      - name: Push docker image to GAR
        if: github.event_name == 'workflow_dispatch' || steps.what-changed.outputs.changed != 'non-inputs'
        uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/lumi-api/Dockerfile
          docker_context: apps/lumi-api
          image_suffix: api
          push_image: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}

  deploy-dev:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
        (inputs.target == 'dev' || inputs.target == 'prod'))
    needs: build
    runs-on: ubuntu-latest
    # One deploy per environment at a time, so merges in the same second do not
    # race on the same Nais objects. A running deploy is never cancelled. The
    # group holds at most one pending deploy: the one queued last replaces it,
    # whether or not it has the newest commit. A manual rollback that is waiting
    # can therefore be replaced by a push deploy.
    timeout-minutes: 15
    concurrency:
      group: deploy-api-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-api/nais/app/dev.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}

  deploy-prod:
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: prod
    timeout-minutes: 15
    concurrency:
      group: deploy-api-prod
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/lumi-api/nais/app/prod.yaml,apps/lumi-api/nais/alerts/prod.yaml
          WORKLOAD_IMAGE: ${{ needs.build.outputs.image }}
