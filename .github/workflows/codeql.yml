name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "17 2 * * *"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Set up Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2588666de8825e1e9dc4e2329a4c985457d55b32
        with:
          languages: "java-kotlin,javascript-typescript"
          build-mode: "manual"

      - name: Build (API)
        run: ./gradlew build -x test
        working-directory: apps/lumi-api

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2588666de8825e1e9dc4e2329a4c985457d55b32
