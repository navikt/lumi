name: Publish @navikt/lumi-survey (GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks and pack, but do not publish"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-lumi-survey
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          # Repo uses .npmrc with ${NPM_AUTH_TOKEN}
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Verify publish boundaries
        run: pnpm run verify:lumi-survey

      - name: Unit tests
        run: pnpm --filter @navikt/lumi-survey test

      - name: Pack (dry-run)
        run: pnpm --filter @navikt/lumi-survey pack --dry-run

      - name: Enforce publish policy (main branch only)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          if [ "${GITHUB_REF_TYPE}" != "branch" ] || [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Publishing is only allowed from the main branch."
            echo "Run the workflow with dry_run=true for tags or non-main branches."
            exit 1
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}

      - name: Guard against 0.0.0 publish
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const pkg = require('./packages/lumi-survey/package.json');
          if (pkg.version === '0.0.0') {
            console.error('Refusing to publish version 0.0.0. Bump packages/lumi-survey/package.json first.');
            process.exit(1);
          }
          NODE

      - name: Guard against private publish
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const pkg = require('./packages/lumi-survey/package.json');
          if (pkg.private) {
            console.error('packages/lumi-survey/package.json has private=true. pnpm publish will refuse.');
            process.exit(1);
          }
          NODE

      - name: Guard against missing changelog entry
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./packages/lumi-survey/package.json');
          const changelog = fs.readFileSync('./packages/lumi-survey/CHANGELOG.md', 'utf8');
          const version = pkg.version;
          const patterns = [`## [${version}]`, `## ${version}`];
          const ok = patterns.some((p) => changelog.includes(p));
          if (!ok) {
            console.error(`Missing changelog entry for ${version} in packages/lumi-survey/CHANGELOG.md`);
            process.exit(1);
          }
          NODE

      - name: Guard against empty release (no meaningful changes)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/lumi-survey/package.json').version")
          TAG="lumi-survey-v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag already exists: ${TAG}. Refusing to publish the same version twice."
            exit 1
          fi

          LAST_TAG=$(git tag -l 'lumi-survey-v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "${LAST_TAG}" ]; then
            echo "No previous lumi-survey release tags found; skipping empty-release guard."
            exit 0
          fi

          echo "Checking for meaningful changes since ${LAST_TAG}…"
          CHANGED=$(git diff --name-only "${LAST_TAG}..HEAD" -- packages/lumi-survey | cat)
          MEANINGFUL=$(echo "${CHANGED}" | grep -vE '^packages/lumi-survey/(package\.json|CHANGELOG\.md)$' || true)

          if [ -z "${MEANINGFUL}" ]; then
            echo "No meaningful changes in packages/lumi-survey since ${LAST_TAG}."
            echo "Only version/changelog changed (or nothing changed). Refusing to publish a new version."
            exit 1
          fi

          echo "Meaningful changes detected:"
          echo "${MEANINGFUL}"

      - name: Publish
        if: ${{ inputs.dry_run == 'false' }}
        run: pnpm --filter @navikt/lumi-survey publish --publish-branch main
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/lumi-survey/package.json').version")
          TAG="lumi-survey-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "@navikt/lumi-survey ${VERSION}"
          git push origin "${TAG}"
