name: Publish @navikt/lumi-survey (GitHub Packages)

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run checks and pack, but do not publish"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

concurrency:
  group: publish-lumi-survey
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci
        env:
          # Repo uses .npmrc with ${NPM_AUTH_TOKEN}
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Verify publish boundaries
        run: npm run verify:lumi-survey

      - name: Unit tests
        run: npm -w @navikt/lumi-survey test

      - name: Pack (dry-run)
        run: npm -w @navikt/lumi-survey pack --dry-run

      - name: Guard against 0.0.0 publish
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const pkg = require('./packages/lumi-survey/package.json');
          if (pkg.version === '0.0.0') {
            console.error('Refusing to publish version 0.0.0. Bump packages/lumi-survey/package.json first.');
            process.exit(1);
          }
          NODE

      - name: Guard against private publish
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const pkg = require('./packages/lumi-survey/package.json');
          if (pkg.private) {
            console.error('packages/lumi-survey/package.json has private=true. npm will refuse to publish.');
            process.exit(1);
          }
          NODE

      - name: Guard against missing changelog entry
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const pkg = require('./packages/lumi-survey/package.json');
          const changelog = fs.readFileSync('./packages/lumi-survey/CHANGELOG.md', 'utf8');
          const version = pkg.version;
          const patterns = [`## [${version}]`, `## ${version}`];
          const ok = patterns.some((p) => changelog.includes(p));
          if (!ok) {
            console.error(`Missing changelog entry for ${version} in packages/lumi-survey/CHANGELOG.md`);
            process.exit(1);
          }
          NODE

      - name: Guard against empty release (no meaningful changes)
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/lumi-survey/package.json').version")
          TAG="lumi-survey-v${VERSION}"

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag already exists: ${TAG}. Refusing to publish the same version twice."
            exit 1
          fi

          LAST_TAG=$(git tag -l 'lumi-survey-v*' --sort=-v:refname | head -n 1 || true)
          if [ -z "${LAST_TAG}" ]; then
            echo "No previous lumi-survey release tags found; skipping empty-release guard."
            exit 0
          fi

          echo "Checking for meaningful changes since ${LAST_TAG}…"
          CHANGED=$(git diff --name-only "${LAST_TAG}..HEAD" -- packages/lumi-survey | cat)
          MEANINGFUL=$(echo "${CHANGED}" | grep -vE '^packages/lumi-survey/(package\.json|CHANGELOG\.md)$' || true)

          if [ -z "${MEANINGFUL}" ]; then
            echo "No meaningful changes in packages/lumi-survey since ${LAST_TAG}."
            echo "Only version/changelog changed (or nothing changed). Refusing to publish a new version."
            exit 1
          fi

          echo "Meaningful changes detected:"
          echo "${MEANINGFUL}"

      - name: Publish
        if: ${{ inputs.dry_run == 'false' }}
        run: npm -w @navikt/lumi-survey publish
        env:
          NPM_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag release
        if: ${{ inputs.dry_run == 'false' }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./packages/lumi-survey/package.json').version")
          TAG="lumi-survey-v${VERSION}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${TAG}" -m "@navikt/lumi-survey ${VERSION}"
          git push origin "${TAG}"
