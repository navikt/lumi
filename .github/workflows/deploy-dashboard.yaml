name: Deploy dashboard

on:
  push:
    branches:
      - demo-*
  workflow_run:
    workflows:
      - CI
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        required: true
        options:
          - demo
          - dev
          - prod
      ref:
        description: Git ref to deploy (branch/tag/sha). Defaults to the ref you run the workflow from.
        type: string
        required: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  checks:
    name: Run checks
    # CI already runs this full gate for every commit pushed to main. Keep the
    # standalone gate for demo branches and manual deployments only.
    if: github.event_name != 'workflow_run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=critical
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Set up Node 22 for Playwright install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 10
        uses: ./.github/actions/install-playwright
      - name: Restore Node from package.json
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - name: Run E2E tests
        run: pnpm run e2e
        env:
          USE_MOCK_DATA: 'true'

  build-demo:
    name: Build demo (mock data)
    needs: checks
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (needs.checks.result == 'success' && (
          startsWith(github.ref_name, 'demo-') ||
          (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
        ))
      )
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: pnpm --filter @navikt/lumi-types run build

      - name: Build dashboard (with mock data)
        run: pnpm --filter lumi-dashboard run build
        env:
          VITE_MOCK_DATA: 'true'
          CDN_BASE_PATH: '/lumi-dashboard-demo'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard-demo'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: demo
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard

  build-production:
    name: Build production
    needs: checks
    runs-on: ubuntu-latest
    if: |
      always() && (
        (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') ||
        (needs.checks.result == 'success' &&
          github.event_name == 'workflow_dispatch' &&
          (inputs.target == 'dev' || inputs.target == 'prod'))
      )
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: pnpm --filter @navikt/lumi-types run build

      - name: Build dashboard (production)
        run: pnpm --filter lumi-dashboard run build
        env:
          CDN_BASE_PATH: '/lumi-dashboard'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard
          image_suffix: dashboard

  deploy-demo:
    name: Deploy to dev-gcp (Demo)
    needs: build-demo
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' ||
      startsWith(github.ref_name, 'demo-') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    environment:
      name: demo
      url: https://lumi-dashboard-demo.ekstern.dev.nav.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/demo.yaml
          VAR: image=${{ needs.build-demo.outputs.image }}

  deploy-dev:
    name: Deploy to dev-gcp
    needs: build-production
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment:
      name: dev
      url: https://lumi-dashboard.ansatt.dev.nav.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/dev.yaml
          VAR: image=${{ needs.build-production.outputs.image }}

  deploy-prod:
    name: Deploy to prod-gcp
    needs: [build-production, deploy-dev]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'workflow_run' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment:
      name: prod
      url: https://lumi-dashboard.ansatt.nav.no
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.ref }}
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/lumi-dashboard/nais/prod.yaml
          VAR: image=${{ needs.build-production.outputs.image }}
