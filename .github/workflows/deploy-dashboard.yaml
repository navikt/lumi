name: Deploy dashboard

on:
  push:
    branches:
      - main
      - demo-*
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        required: true
        options:
          - demo
          - dev
          - prod
      ref:
        description: Git ref to deploy (branch/tag/sha). Defaults to the ref you run the workflow from.
        type: string
        required: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=critical
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm test
      - name: Set up Node 22 for Playwright install
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 10
        run: pnpm --filter lumi-dashboard exec playwright install chromium --with-deps --only-shell
        env:
          DEBUG: pw:install
      - name: Restore Node from package.json
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
      - name: Run E2E tests
        run: pnpm run e2e
        env:
          USE_MOCK_DATA: 'true'

  build-demo:
    name: Build demo (mock data)
    needs: checks
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      startsWith(github.ref_name, 'demo-') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: pnpm --filter @navikt/lumi-types run build

      - name: Build dashboard (with mock data)
        run: pnpm --filter lumi-dashboard run build
        env:
          VITE_MOCK_DATA: 'true'
          CDN_BASE_PATH: '/lumi-dashboard-demo'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard-demo'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@05dbb6091b30bd84279c6d64a45ef8782fd410a5
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: demo
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard

  build-production:
    name: Build production
    needs: checks
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'dev' || inputs.target == 'prod'))
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version-file: package.json
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: pnpm --filter @navikt/lumi-types run build

      - name: Build dashboard (production)
        run: pnpm --filter lumi-dashboard run build
        env:
          CDN_BASE_PATH: '/lumi-dashboard'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@05dbb6091b30bd84279c6d64a45ef8782fd410a5
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard
          image_suffix: dashboard

  deploy-demo:
    name: Deploy to dev-gcp (Demo)
    needs: build-demo
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      startsWith(github.ref_name, 'demo-') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    environment:
      name: demo
      url: https://lumi-dashboard-demo.ekstern.dev.nav.no
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/demo.yaml
          VAR: image=${{ needs.build-demo.outputs.image }}

  deploy-dev:
    name: Deploy to dev-gcp
    needs: build-production
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment:
      name: dev
      url: https://lumi-dashboard.ansatt.dev.nav.no
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/dev.yaml
          VAR: image=${{ needs.build-production.outputs.image }}

  deploy-prod:
    name: Deploy to prod-gcp
    needs: [build-production, deploy-dev]
    runs-on: ubuntu-latest
    if: |
      (github.event_name == 'push' && github.ref_name == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment:
      name: prod
      url: https://lumi-dashboard.ansatt.nav.no
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: nais/deploy/actions/deploy@a7f8690f9b367fcbf5348a0a1e21d44f1aae50eb
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/lumi-dashboard/nais/prod.yaml
          VAR: image=${{ needs.build-production.outputs.image }}
