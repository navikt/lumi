name: Deploy dashboard

on:
  push:
    branches:
      - main
      - demo-*
  workflow_dispatch:
    inputs:
      target:
        description: Where to deploy
        type: choice
        required: true
        options:
          - demo
          - dev
          - prod
      ref:
        description: Git ref to deploy (branch/tag/sha). Defaults to the ref you run the workflow from.
        type: string
        required: false

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: Run E2E tests
        run: npm run e2e
        env:
          USE_MOCK_DATA: 'true'

  build-demo:
    name: Build demo (mock data)
    needs: checks
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'demo-') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: npm -w packages/lumi-types run build

      - name: Build dashboard (with mock data)
        run: npm -w apps/lumi-dashboard run build
        env:
          VITE_MOCK_DATA: 'true'
          CDN_BASE_PATH: '/lumi-dashboard-demo'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@fa754451577294aae42872a69b888b3470478ec1
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard-demo'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@87f920b0411b987d9a1fd4113aa384e1e3b54f2c
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          image_suffix: demo
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard

  build-production:
    name: Build production
    needs: checks
    runs-on: ubuntu-latest
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch' && (inputs.target == 'dev' || inputs.target == 'prod'))
    outputs:
      image: ${{ steps.docker-build-push.outputs.image }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}

      - name: Build shared types
        run: npm -w packages/lumi-types run build

      - name: Build dashboard (production)
        run: npm -w apps/lumi-dashboard run build
        env:
          CDN_BASE_PATH: '/lumi-dashboard'

      - name: Copy static files
        run: |
          cd apps/lumi-dashboard
          cp -r .output/public .output/client

      - name: Upload static files to NAV CDN
        uses: nais/deploy/actions/cdn-upload/v2@fa754451577294aae42872a69b888b3470478ec1
        with:
          team: team-esyfo
          source: ./apps/lumi-dashboard/.output/client
          destination: '/lumi-dashboard'
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push to GAR
        uses: nais/docker-build-push@87f920b0411b987d9a1fd4113aa384e1e3b54f2c
        id: docker-build-push
        with:
          team: team-esyfo
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          dockerfile: apps/lumi-dashboard/Dockerfile
          docker_context: apps/lumi-dashboard

  deploy-demo:
    name: Deploy to dev-gcp (Demo)
    needs: build-demo
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref_name, 'demo-') ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'demo')
    environment:
      name: demo
      url: https://lumi-dashboard-demo.ekstern.dev.nav.no
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/demo.yaml
          VAR: image=${{ needs.build-demo.outputs.image }}

  deploy-dev:
    name: Deploy to dev-gcp
    needs: build-production
    runs-on: ubuntu-latest
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'dev')
    environment:
      name: dev
      url: https://lumi-dashboard.ansatt.dev.nav.no
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1
        env:
          CLUSTER: dev-gcp
          RESOURCE: apps/lumi-dashboard/nais/dev.yaml
          VAR: image=${{ needs.build-production.outputs.image }}

  deploy-prod:
    name: Deploy to prod-gcp
    needs: [build-production, deploy-dev]
    runs-on: ubuntu-latest
    if: |
      github.ref_name == 'main' ||
      (github.event_name == 'workflow_dispatch' && inputs.target == 'prod')
    environment:
      name: prod
      url: https://lumi-dashboard.ansatt.nav.no
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: nais/deploy/actions/deploy@fa754451577294aae42872a69b888b3470478ec1
        env:
          CLUSTER: prod-gcp
          RESOURCE: apps/lumi-dashboard/nais/prod.yaml
          VAR: image=${{ needs.build-production.outputs.image }}
