name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      node: ${{ steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            node:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.github/skills/**'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'packages/**'
            api:
              - '.github/workflows/**'
              - 'apps/lumi-api/**'
            docs:
              - 'docs/**'
              - 'packages/lumi-survey/CHANGELOG.md'

  required:
    name: Merge gate
    needs: [changes, node, api, docs]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # We keep this job always-running so branch protection can require a single check.
          # Accept "skipped" because we conditionally run jobs based on changed paths.
          results=(
            "changes=${{ needs.changes.result }}"
            "node=${{ needs.node.result }}"
            "api=${{ needs.api.result }}"
            "docs=${{ needs.docs.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success|skipped) ;;
              cancelled)
                echo "Required job was cancelled: $r"
                echo "This usually happens when a newer push cancels an in-flight run (concurrency.cancel-in-progress) or someone manually cancels the workflow."
                echo "Wait for the latest CI run on the PR/branch to finish."
                exit 1
                ;;
              *)
                echo "Required job failed: $r"
                exit 1
                ;;
            esac
          done

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Verify lumi-survey packaging boundaries
        run: pnpm run verify:lumi-survey
      - name: Unit tests
        run: pnpm test
      - name: Set up Node 22 for Playwright install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 10
        run: pnpm --filter lumi-dashboard exec playwright install chromium --with-deps --only-shell
        env:
          DEBUG: pw:install
      - name: Restore Node from package.json
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - name: E2E tests
        run: pnpm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run tests
        working-directory: apps/lumi-api
        run: ./gradlew test

  docs:
    name: Build docs
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install docs deps
        run: pnpm install --filter lumi-docs --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Build docs
        run: pnpm --filter lumi-docs run build
