name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      node: ${{ steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d
        with:
          filters: |
            node:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'packages/**'
            api:
              - '.github/workflows/**'
              - 'apps/lumi-api/**'
            docs:
              - 'docs/**'

  required:
    name: Merge gate
    needs: [changes, node, api, docs]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # We keep this job always-running so branch protection can require a single check.
          # Accept "skipped" because we conditionally run jobs based on changed paths.
          results=(
            "changes=${{ needs.changes.result }}"
            "node=${{ needs.node.result }}"
            "api=${{ needs.api.result }}"
            "docs=${{ needs.docs.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success|skipped) ;;
              cancelled)
                echo "Required job was cancelled: $r"
                echo "This usually happens when a newer push cancels an in-flight run (concurrency.cancel-in-progress) or someone manually cancels the workflow."
                echo "Wait for the latest CI run on the PR/branch to finish."
                exit 1
                ;;
              *)
                echo "Required job failed: $r"
                exit 1
                ;;
            esac
          done

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=critical
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Verify lumi-survey packaging boundaries
        run: pnpm run verify:lumi-survey
      - name: Unit tests
        run: pnpm test
      - name: Install Playwright
        run: pnpm --filter lumi-dashboard exec playwright install chromium --with-deps
      - name: E2E tests
        run: pnpm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@39e147cb9de83bb9910b8ef8bd7fff0ee20fcd6f
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run tests
        working-directory: apps/lumi-api
        run: ./gradlew test

  docs:
    name: Build docs
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - name: Install docs deps
        run: pnpm --dir docs install --ignore-workspace --frozen-lockfile
      - name: Build docs
        run: pnpm --dir docs --ignore-workspace run build
