name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      node: ${{ steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'packages/**'
            api:
              - '.github/workflows/**'
              - 'apps/lumi-api/**'
            docs:
              - 'docs/**'

  required:
    name: Merge gate
    needs: [changes, node, api, docs]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # We keep this job always-running so branch protection can require a single check.
          # Accept "skipped" because we conditionally run jobs based on changed paths.
          results=(
            "changes=${{ needs.changes.result }}"
            "node=${{ needs.node.result }}"
            "api=${{ needs.api.result }}"
            "docs=${{ needs.docs.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success|skipped) ;;
              cancelled)
                echo "Required job was cancelled: $r"
                echo "This usually happens when a newer push cancels an in-flight run (concurrency.cancel-in-progress) or someone manually cancels the workflow."
                echo "Wait for the latest CI run on the PR/branch to finish."
                exit 1
                ;;
              *)
                echo "Required job failed: $r"
                exit 1
                ;;
            esac
          done

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Dependency audit (production)
        run: npm audit --omit=dev --audit-level=critical
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify lumi-survey packaging boundaries
        run: npm run verify:lumi-survey
      - name: Unit tests
        run: npm test
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - name: Setup Java
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run tests
        working-directory: apps/lumi-api
        run: ./gradlew test

  docs:
    name: Build docs
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: Install docs deps
        run: cd docs && npm ci
      - name: Build docs
        run: cd docs && npm run build
