name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'packages/**'
            api:
              - '.github/workflows/**'
              - 'apps/lumi-api/**'

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify lumi-survey packaging boundaries
        run: npm run verify:lumi-survey
      - name: Unit tests
        run: npm test
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run tests
        working-directory: apps/lumi-api
        run: ./gradlew test
