name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - id: filter
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36
        with:
          filters: |
            node:
              - 'package.json'
              - 'package-lock.json'
              - 'biome.json'
              - 'tsconfig*.json'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'packages/**'
            api:
              - '.github/workflows/**'
              - 'apps/lumi-api/**'

  required:
    name: Merge gate
    needs: [changes, node, api]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # We keep this job always-running so branch protection can require a single check.
          # Accept "skipped" because we conditionally run jobs based on changed paths.
          results=(
            "changes=${{ needs.changes.result }}"
            "node=${{ needs.node.result }}"
            "api=${{ needs.api.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success|skipped) ;;
              *)
                echo "Required job failed: $r"
                exit 1
                ;;
            esac
          done

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
        env:
          NPM_AUTH_TOKEN: ${{ secrets.READER_TOKEN }}
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Verify lumi-survey packaging boundaries
        run: npm run verify:lumi-survey
      - name: Unit tests
        run: npm test
      - name: Install Playwright
        run: npx playwright install chromium --with-deps
      - name: E2E tests
        run: npm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Java
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run tests
        working-directory: apps/lumi-api
        run: ./gradlew test
