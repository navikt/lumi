name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: github.event_name != 'merge_group'
    outputs:
      node: ${{ steps.dashboard-scope.outputs.node || steps.filter.outputs.node }}
      api: ${{ steps.filter.outputs.api }}
      docs: ${{ steps.filter.outputs.docs }}
      full_chain: ${{ steps.dashboard-scope.outputs.full_chain || steps.filter.outputs.full_chain }}
      dashboard_deploy: ${{ steps.dashboard-scope.outputs.required || steps.filter.outputs.dashboard_deploy }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        with:
          filters: |
            node:
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.npmrc'
              - 'biome.json'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'LICENSE'
              - 'tsconfig*.json'
              - '.github/instructions/**'
              - '.github/actions/**'
              - '.github/workflows/**'
              - 'apps/lumi-dashboard/**'
              - 'apps/lumi-local-demo/**'
              - 'packages/**'
              - 'scripts/check-lumi-survey-release-drift.mjs'
              - 'scripts/check-lumi-survey-release-drift.test.mjs'
              - 'scripts/verify-deploy-api-trigger.test.mjs'
              - 'scripts/verify-deploy-dashboard-trigger.test.mjs'
              - 'scripts/verify-github-actions-pins.test.mjs'
              - 'scripts/verify-lumi-survey-package.mjs'
              - 'scripts/verify-lumi-survey-package.test.mjs'
              - 'scripts/verify-lumi-survey-consumer.sh'
              - 'scripts/fixtures/lumi-survey-consumer/**'
            api:
              - '.github/workflows/**'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'apps/lumi-api/**'
              - 'apps/lumi-submission-proxy/**'
            docs:
              - 'docs/**'
              - 'packages/lumi-survey/CHANGELOG.md'
            full_chain:
              - '.github/actions/install-playwright/**'
              - '.github/workflows/ci.yaml'
              - '.dockerignore'
              - 'docker-compose.yml'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'apps/lumi-api/**'
              - 'apps/lumi-dashboard/**'
              - 'apps/lumi-local-demo/**'
              - 'apps/lumi-submission-proxy/**'
              - 'packages/lumi-survey/**'
              - 'packages/lumi-types/**'
              - 'scripts/lumi-full-chain-e2e.sh'
            dashboard_deploy:
              - '.github/workflows/deploy-dashboard.yaml'
              - '.npmrc'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig*.json'
              - 'apps/lumi-dashboard/**'
              - 'packages/lumi-survey/**'
              - 'packages/lumi-types/**'
      - name: Record dashboard deployment scope
        id: dashboard-scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DASHBOARD_DEPLOY_REQUIRED: ${{ steps.filter.outputs.dashboard_deploy }}
          NODE_REQUIRED: ${{ steps.filter.outputs.node }}
          FULL_CHAIN_REQUIRED: ${{ steps.filter.outputs.full_chain }}
          BEFORE_SHA: ${{ github.event.before }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          required="$DASHBOARD_DEPLOY_REQUIRED"
          node_required="$NODE_REQUIRED"
          full_chain_required="$FULL_CHAIN_REQUIRED"

          # A newer main push can cancel the previous CI run. If that happened,
          # validate and deploy the cumulative current head so no type of next
          # change can hide its unvalidated predecessor.
          previous_success_count="$(
            gh run list \
              --repo "$REPOSITORY" \
              --workflow ci.yaml \
              --commit "$BEFORE_SHA" \
              --branch main \
              --event push \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq 'length' || true
          )"
          if [[ "$previous_success_count" != "1" ]]; then
            required=true
            node_required=true
            full_chain_required=true
            echo "::warning::Previous main commit has no successful CI run; validating and deploying the cumulative head"
          fi

          mkdir -p "$RUNNER_TEMP/dashboard-deploy-scope"
          printf '%s\n' "$required" > "$RUNNER_TEMP/dashboard-deploy-scope/required"
          {
            echo "required=$required"
            echo "node=$node_required"
            echo "full_chain=$full_chain_required"
          } >> "$GITHUB_OUTPUT"
      - name: Publish dashboard deployment scope
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dashboard-deploy-scope
          path: ${{ runner.temp }}/dashboard-deploy-scope/required
          if-no-files-found: error
          retention-days: 1

  required:
    name: Merge gate
    needs: [changes, node, api, docs, full-chain]
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: read
    steps:
      - name: Check required jobs
        shell: bash
        run: |
          set -euo pipefail

          # We keep this job always-running so branch protection can require a single check.
          # Accept "skipped" because we conditionally run jobs based on changed paths.
          results=(
            "changes=${{ needs.changes.result }}"
            "node=${{ needs.node.result }}"
            "api=${{ needs.api.result }}"
            "docs=${{ needs.docs.result }}"
            "full-chain=${{ needs.full-chain.result }}"
          )
          printf '%s\n' "${results[@]}"

          for r in "${results[@]}"; do
            status="${r#*=}"
            case "$status" in
              success|skipped) ;;
              cancelled)
                echo "Required job was cancelled: $r"
                echo "This usually happens when a newer push cancels an in-flight run (concurrency.cancel-in-progress) or someone manually cancels the workflow."
                echo "Wait for the latest CI run on the PR/branch to finish."
                exit 1
                ;;
              *)
                echo "Required job failed: $r"
                exit 1
                ;;
            esac
          done

  node:
    name: Lint / Typecheck / Test (Node)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.node == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
      - name: Check lumi-survey release drift
        run: pnpm run test:release-guards && pnpm run check:lumi-survey-release-drift
      - name: Dependency audit (production)
        run: pnpm audit --prod --audit-level=high
      - name: Lint
        run: pnpm run lint
      - name: Typecheck
        run: pnpm run typecheck
      - name: Build local survey demo
        run: pnpm --filter lumi-local-demo run build
      - name: Validate local Compose config
        run: docker compose config --quiet
        env:
          NPM_AUTH_TOKEN: config-only
      - name: Verify lumi-survey packaging boundaries
        run: pnpm run verify:lumi-survey
      - name: Verify packed lumi-survey consumer
        run: pnpm run verify:lumi-survey-consumer
      - name: Unit tests
        run: pnpm test
      - name: Set up Node 22 for Playwright install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 10
        uses: ./.github/actions/install-playwright
      - name: Restore Node from package.json
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - name: E2E tests
        run: pnpm run e2e
        env:
          USE_MOCK_DATA: 'true'

  api:
    name: Test (Kotlin)
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.api == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Setup Java
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c
        with:
          distribution: temurin
          java-version: 21
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
          cache-overwrite-existing: true
      - name: Run API tests
        working-directory: apps/lumi-api
        run: ./gradlew test
      - name: Run submission proxy tests
        working-directory: apps/lumi-submission-proxy
        run: ./gradlew test

  full-chain:
    name: Full-chain smoke
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.full_chain == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
      - name: Set up Node 22 for Playwright install
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Playwright
        timeout-minutes: 10
        uses: ./.github/actions/install-playwright
      - name: Restore Node from package.json
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
      - name: Run full-chain smoke
        run: pnpm run test:full-chain
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
      - name: Upload full-chain evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: full-chain-release-verification-${{ github.run_id }}
          path: apps/lumi-dashboard/test-results/full-chain
          if-no-files-found: warn
          retention-days: 14

  docs:
    name: Build docs
    needs: changes
    if: always() && (github.event_name == 'merge_group' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: package.json
          cache: pnpm
      - name: Install docs deps
        run: pnpm install --filter lumi-docs --frozen-lockfile
        env:
          NPM_AUTH_TOKEN: ${{ github.token }}
      - name: Build docs
        run: pnpm --filter lumi-docs run build
