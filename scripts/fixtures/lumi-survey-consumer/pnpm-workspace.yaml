packages:
  - "."

# The verification step installs like an external consumer from npmjs, without
# a package token (see .npmrc). Keep scoped transitive packages aligned with
# the root install so pnpm can reuse them from its store when the temp
# directory shares it.
overrides:
  "@navikt/aksel-icons": 8.9.0
  "@navikt/ds-tokens": 8.9.0

allowBuilds:
  esbuild: true
