packages:
  - "."

# The verification step deliberately receives no package token. Keep scoped
# transitive packages aligned with the authenticated root install so pnpm can
# reuse them from its store; missing public packages may still be downloaded.
overrides:
  "@navikt/aksel-icons": 8.9.0
  "@navikt/ds-tokens": 8.9.0

allowBuilds:
  esbuild: true
