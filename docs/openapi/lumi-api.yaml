openapi: 3.0.3
info:
  title: Lumi API
  version: 1.0.0
  description: |
    OpenAPI-utkast for pentest-onboarding.

    Viktig:
    - `lumi-api` er intern i NAIS og har ikke offentlig ingress.
    - Specen er en versjonert fil i repo, ikke et runtime-generert endpoint.
    - Endepunkter under `/api/v1/intern/*` krever dashboard-kontekst
      (Azure auth + client-autorisasjon + team-autorisasjon).
    - Submission er splittet på issuer-spesifikke endepunkter.
servers:
  - url: http://lumi-api
    description: Intern service discovery i NAIS

tags:
  - name: submission
    description: Innsending av feedback
  - name: analytics
    description: Team-beskyttet analyse-API
  - name: internal
    description: Operasjonelle health/metrics-endepunkter

paths:
  /api/tokenx/v1/feedback:
    post:
      tags: [submission]
      summary: Send inn feedback (TokenX)
      security:
        - TokenXBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionV1'
      responses:
        '201':
          description: Opprettet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/azure/v1/feedback:
    post:
      tags: [submission]
      summary: Send inn feedback (Azure)
      security:
        - AzureSubmissionBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackSubmissionV1'
      responses:
        '201':
          description: Opprettet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /api/v1/intern/feedback:
    get:
      tags: [analytics]
      summary: Hent paginert feedback (team-skopet)
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/page'
        - $ref: '#/components/parameters/size'
        - $ref: '#/components/parameters/hasText'
        - $ref: '#/components/parameters/lowRating'
        - $ref: '#/components/parameters/tag'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/theme'
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Paginert feedback-respons
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/feedback/{id}:
    get:
      tags: [analytics]
      summary: Hent én feedback
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Feedback-funn
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [analytics]
      summary: Slett én feedback (permanent)
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
      responses:
        '204':
          description: Slettet
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/intern/feedback/{id}/tags:
    post:
      tags: [analytics]
      summary: Legg til tag på feedback
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagInput'
      responses:
        '201':
          description: Tag lagt til
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [analytics]
      summary: Fjern tag fra feedback
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
        - name: tag
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Tag fjernet
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/v1/intern/feedback/tags:
    get:
      tags: [analytics]
      summary: Hent alle tags for valgt team
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Tag-liste
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/feedback/teams:
    get:
      tags: [analytics]
      summary: Hent apper for valgt team
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Teams/apps-mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsAndApps'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/feedback/metadata-keys:
    get:
      tags: [analytics]
      summary: Hent metadata keys/values for survey
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - name: surveyId
          in: query
          required: true
          schema:
            type: string
        - name: maxCardinality
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: Metadata key-respons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/surveys:
    get:
      tags: [analytics]
      summary: Hent surveys gruppert per app
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Surveys per app
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: array
                  items:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/surveys/{surveyId}:
    delete:
      tags: [analytics]
      summary: Slett all feedback for én survey
      security:
        - AzureDashboardBearer: []
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Sletteresultat
          content:
            application/json:
              schema:
                type: object
                properties:
                  surveyId:
                    type: string
                  deletedCount:
                    type: integer
                required: [surveyId, deletedCount]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/surveys/{surveyId}/context-tags:
    get:
      tags: [analytics]
      summary: Hent kontekst-tags med cardinality-filter
      security:
        - AzureDashboardBearer: []
      parameters:
        - name: surveyId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/team'
        - name: maxCardinality
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/hasText'
        - $ref: '#/components/parameters/lowRating'
      responses:
        '200':
          description: Context-tags-respons
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/v1/intern/stats/dashboard:
    get:
      tags: [analytics]
      summary: Dashboard-statistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Dashboard-statistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/intern/stats/overview:
    get:
      tags: [analytics]
      summary: Oversiktsstatistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Oversiktsstatistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/ratings:
    get:
      tags: [analytics]
      summary: Rating-fordeling
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Rating-fordeling
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/timeline:
    get:
      tags: [analytics]
      summary: Tidslinjedata
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Tidslinje
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/top-tasks:
    get:
      tags: [analytics]
      summary: Top Tasks-statistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Top Tasks-statistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/survey-types:
    get:
      tags: [analytics]
      summary: Fordeling av survey-typer
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Survey-type-fordeling
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/blockers:
    get:
      tags: [analytics]
      summary: Blocker-statistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Blocker-statistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/discovery:
    get:
      tags: [analytics]
      summary: Discovery-statistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Discovery-statistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/stats/task-priority:
    get:
      tags: [analytics]
      summary: Task Priority-statistikk
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Task Priority-statistikk
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/themes:
    get:
      tags: [analytics]
      summary: Hent themes
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - name: context
          in: query
          required: false
          schema:
            type: string
            enum: [GENERAL_FEEDBACK, BLOCKER]
      responses:
        '200':
          description: Theme-liste
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [analytics]
      summary: Opprett theme
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Theme opprettet
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Konflikt (f.eks. duplikat)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/v1/intern/themes/{id}:
    put:
      tags: [analytics]
      summary: Oppdater theme
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Theme oppdatert
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [analytics]
      summary: Slett theme
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/idPath'
        - $ref: '#/components/parameters/team'
      responses:
        '204':
          description: Theme slettet
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/intern/filters/bootstrap:
    get:
      tags: [analytics]
      summary: Hent bootstrap-data for filter UI
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Filter-bootstrap
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/teams:
    get:
      tags: [analytics]
      summary: Hent alle autoriserte team med apper
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
      responses:
        '200':
          description: Teams/apps-mapping
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamsAndApps'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/intern/export:
    get:
      tags: [analytics]
      summary: Eksporter feedback-data
      security:
        - AzureDashboardBearer: []
      parameters:
        - $ref: '#/components/parameters/team'
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [CSV, JSON, EXCEL]
            default: CSV
        - $ref: '#/components/parameters/app'
        - $ref: '#/components/parameters/hasText'
        - $ref: '#/components/parameters/lowRating'
        - $ref: '#/components/parameters/tag'
        - $ref: '#/components/parameters/query'
        - $ref: '#/components/parameters/fromDate'
        - $ref: '#/components/parameters/toDate'
        - $ref: '#/components/parameters/surveyId'
        - $ref: '#/components/parameters/deviceType'
        - $ref: '#/components/parameters/segment'
        - $ref: '#/components/parameters/theme'
        - $ref: '#/components/parameters/task'
        - $ref: '#/components/parameters/ratingFieldId'
        - $ref: '#/components/parameters/ratingValue'
      responses:
        '200':
          description: Eksport-respons
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: string
            application/vnd.openxmlformats-officedocument.spreadsheetml.sheet:
              schema:
                type: string
                format: binary
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /internal/isAlive:
    get:
      tags: [internal]
      summary: Liveness-probe
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /internal/isReady:
    get:
      tags: [internal]
      summary: Readiness-probe
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /internal/prometheus:
    get:
      tags: [internal]
      summary: Prometheus metrics
      responses:
        '200':
          description: Metrics
          content:
            text/plain:
              schema:
                type: string

components:
  securitySchemes:
    TokenXBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: TokenX-token for submission
    AzureSubmissionBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure-token for submission
    AzureDashboardBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Azure dashboard-token (med client/team-autorisasjon)

  responses:
    BadRequest:
      description: Ugyldig forespørsel
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Ikke autentisert
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Ikke autorisert
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Ikke funnet
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    PayloadTooLarge:
      description: Payload for stor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TooManyRequests:
      description: For mange forespørsler (rate limited)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ServiceUnavailable:
      description: Midlertidig utilgjengelig
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  parameters:
    team:
      name: team
      in: query
      required: false
      schema:
        type: string
      description: Valgfritt team-scope. Hvis utelatt velger backend et autorisert standardteam.
    app:
      name: app
      in: query
      required: false
      schema:
        type: string
    fromDate:
      name: fromDate
      in: query
      required: false
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}-\\d{2}$'
    toDate:
      name: toDate
      in: query
      required: false
      schema:
        type: string
        pattern: '^\\d{4}-\\d{2}-\\d{2}$'
    surveyId:
      name: surveyId
      in: query
      required: false
      schema:
        type: string
    page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 0
        default: 0
    size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 10
    hasText:
      name: hasText
      in: query
      required: false
      schema:
        type: boolean
    lowRating:
      name: lowRating
      in: query
      required: false
      schema:
        type: boolean
    tag:
      name: tag
      in: query
      required: false
      schema:
        type: array
        maxItems: 20
        items:
          type: string
      style: form
      explode: true
    query:
      name: query
      in: query
      required: false
      schema:
        type: string
        maxLength: 200
    deviceType:
      name: deviceType
      in: query
      required: false
      schema:
        type: string
        enum: [mobile, tablet, desktop]
    segment:
      name: segment
      in: query
      required: false
      schema:
        type: array
        maxItems: 20
        items:
          type: string
          example: key:value
      style: form
      explode: true
    theme:
      name: theme
      in: query
      required: false
      schema:
        type: string
    task:
      name: task
      in: query
      required: false
      schema:
        type: string
    ratingFieldId:
      name: ratingFieldId
      in: query
      required: false
      schema:
        type: string
    ratingValue:
      name: ratingValue
      in: query
      required: false
      schema:
        type: integer
    idPath:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ApiError:
      type: object
      properties:
        message:
          type: string
        status:
          type: integer
        type:
          type: string
      required: [message]

    SubmissionCreated:
      type: object
      properties:
        id:
          type: string
      required: [id]

    TagInput:
      type: object
      properties:
        tag:
          type: string
      required: [tag]

    TeamsAndApps:
      type: object
      properties:
        teams:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [teams]

    FeedbackPage:
      type: object
      properties:
        content:
          type: array
          items:
            type: object
            additionalProperties: true
        totalPages:
          type: integer
        totalElements:
          type: integer
        size:
          type: integer
        number:
          type: integer
        hasNext:
          type: boolean
        hasPrevious:
          type: boolean
      required: [content, totalPages, totalElements, size, number, hasNext, hasPrevious]

    FeedbackSubmissionV1:
      type: object
      properties:
        schemaVersion:
          type: integer
          enum: [1]
        surveyId:
          type: string
          minLength: 1
          maxLength: 200
        surveyType:
          type: string
          enum: [rating, topTasks, taskPriority, discovery, custom]
        submittedAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        timeToCompleteMs:
          type: integer
          format: int64
          minimum: 0
        context:
          $ref: '#/components/schemas/SubmissionContextV1'
        answers:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/Answer'
      required: [schemaVersion, surveyId, surveyType, submittedAt, answers]

    SubmissionContextV1:
      type: object
      properties:
        url:
          type: string
        pathname:
          type: string
        deviceType:
          type: string
          enum: [mobile, tablet, desktop]
        viewport:
          $ref: '#/components/schemas/Viewport'
        userAgent:
          type: string
        tags:
          type: object
          maxProperties: 20
          description: Maks 20 nøkler. Nøkkel maks 50 tegn, verdi maks 100 tegn for tekst.
          additionalProperties:
            oneOf:
              - type: string
                minLength: 1
                maxLength: 100
              - type: number
              - type: boolean
        debug:
          type: object
          description: Defence-in-depth grenseverdier i backend (ca. 8 KiB, maks dybde 4, maks 50 nøkler).
          additionalProperties: true

    Answer:
      type: object
      properties:
        fieldId:
          type: string
          minLength: 1
        fieldType:
          type: string
          enum: [RATING, TEXT, SINGLE_CHOICE, MULTI_CHOICE, DATE]
        question:
          $ref: '#/components/schemas/Question'
        value:
          oneOf:
            - $ref: '#/components/schemas/RatingValue'
            - $ref: '#/components/schemas/TextValue'
            - $ref: '#/components/schemas/SingleChoiceValue'
            - $ref: '#/components/schemas/MultiChoiceValue'
            - $ref: '#/components/schemas/DateValue'
      required: [fieldId, fieldType, question, value]

    Viewport:
      type: object
      properties:
        width:
          type: integer
          minimum: 0
        height:
          type: integer
          minimum: 0
      required: [width, height]

    ChoiceOption:
      type: object
      properties:
        id:
          type: string
          minLength: 1
        label:
          type: string
          minLength: 1
      required: [id, label]

    Question:
      type: object
      properties:
        label:
          type: string
          minLength: 1
        description:
          type: string
        options:
          type: array
          items:
            $ref: '#/components/schemas/ChoiceOption'
      required: [label]

    RatingValue:
      type: object
      properties:
        type:
          type: string
          enum: [rating]
        rating:
          type: integer
        ratingVariant:
          type: string
          enum: [emoji, thumbs, stars, nps]
        ratingScale:
          type: integer
      required: [type, rating, ratingVariant, ratingScale]

    TextValue:
      type: object
      properties:
        type:
          type: string
          enum: [text]
        text:
          type: string
          maxLength: 2000
      required: [type, text]

    SingleChoiceValue:
      type: object
      properties:
        type:
          type: string
          enum: [singleChoice]
        selectedOptionId:
          type: string
      required: [type, selectedOptionId]

    MultiChoiceValue:
      type: object
      properties:
        type:
          type: string
          enum: [multiChoice]
        selectedOptionIds:
          type: array
          items:
            type: string
      required: [type, selectedOptionIds]

    DateValue:
      type: object
      properties:
        type:
          type: string
          enum: [date]
        date:
          type: string
      required: [type, date]
