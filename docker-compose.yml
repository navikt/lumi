# Local full-chain stack for Lumi:
# browser -> lumi-survey -> submission-proxy -> lumi-api -> Postgres -> dashboard.
#
# Start everything with `docker compose up --build` (or `npm run local:up`).
# The explicit LUMI_LOCAL_AUTH_BYPASS flags are fail-closed and must never be
# copied to a deployed environment. See scripts/README.md for the workflow.

services:
  postgres:
    image: postgres:17-alpine
    container_name: lumi-postgres
    environment:
      POSTGRES_DB: lumi
      POSTGRES_USER: lumi
      POSTGRES_PASSWORD: lumi
    ports:
      - "5432:5432"
    volumes:
      - lumi-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumi -d lumi"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./apps/lumi-api
      dockerfile: Dockerfile.local
    container_name: lumi-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: lumi
      DB_USERNAME: lumi
      DB_PASSWORD: lumi
      # Local mode disables submission auth — it is fail-closed, so opt in explicitly.
      LUMI_LOCAL_AUTH_BYPASS: "true"
      LUMI_INTERNAL_SUBMISSION_KEY: "local-full-chain-only"
    ports:
      - "8080:8080"

  submission-proxy:
    build:
      context: ./apps/lumi-submission-proxy
      dockerfile: Dockerfile.local
    container_name: lumi-submission-proxy
    depends_on:
      - api
    environment:
      LUMI_API_BASE_URL: http://api:8080
      LUMI_INTERNAL_SUBMISSION_KEY: "local-full-chain-only"
      LUMI_LOCAL_AUTH_BYPASS: "true"
    ports:
      - "8081:8080"

  dashboard:
    build:
      context: .
      dockerfile: apps/lumi-dashboard/Dockerfile.local
      secrets:
        - npm_token
    container_name: lumi-dashboard
    depends_on:
      - api
    environment:
      LUMI_API_URL: http://api:8080
      USE_MOCK_DATA: "false"
      LUMI_LOCAL_AUTH_BYPASS: "true"
    ports:
      - "3000:3000"

  demo:
    build:
      context: .
      dockerfile: apps/lumi-local-demo/Dockerfile.local
      secrets:
        - npm_token
    container_name: lumi-local-demo
    depends_on:
      - submission-proxy
    ports:
      - "3001:8080"

volumes:
  lumi-postgres-data:

secrets:
  npm_token:
    environment: NPM_AUTH_TOKEN
