apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: lumi-submission-proxy
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: 1
    max: 1
  liveness:
    path: /internal/isAlive
    initialDelay: 10
  readiness:
    path: /internal/isReady
    initialDelay: 10
  resources:
    limits:
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: trygdeetaten.no
  accessPolicy:
    inbound:
      rules:
        - application: syfomodiaperson
          namespace: teamsykefravr
        - application: modiapersonoversikt-api
          namespace: personoversikt
    outbound:
      rules:
        - application: lumi-api
  envFrom:
    - secret: lumi
  env:
    - name: LUMI_API_BASE_URL
      value: http://lumi-api
