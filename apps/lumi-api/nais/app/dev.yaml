apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: lumi-api
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{image}}
  port: 8080
  replicas:
    min: 1
    max: 2
  liveness:
    path: /internal/isAlive
    initialDelay: 30
  readiness:
    path: /internal/isReady
    initialDelay: 30
  resources:
    limits:
      memory: 768Mi
    requests:
      cpu: 100m
      memory: 384Mi
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  tokenx:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
      claims:
        extra:
          - "NAVident"
  accessPolicy:
    inbound:
      rules:
        - application: lumi-dashboard
        - application: bro-frontend
        - application: syfo-oppfolgingsplan-frontend
        - application: narmesteleder-frontend
        - application: dinesykmeldte
        - application: syfomodiaperson
          namespace: teamsykefravr
        - application: modiapersonoversikt-api
          namespace: personoversikt
        - application: lumi-submission-proxy
        - application: oppfolgingsplan-frontend
    outbound:
      external:
        - host: console.nav.cloud.nais.io
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        diskAutoresize: true
        databases:
          - name: lumi
            envVarPrefix: DB
  valkey:
    - instance: lumi-cache
      access: readwrite
  envFrom:
    - secret: nais-api-key
    - secret: lumi
  env:
    - name: NAIS_CLUSTER_NAME
      value: dev-gcp
    - name: LUMI_DASHBOARD_CLIENT_ID
      value: dev-gcp:team-esyfo:lumi-dashboard
    - name: NAIS_API_GRAPHQL_URL
      value: https://console.nav.cloud.nais.io/graphql
    - name: LUMI_CORS_ALLOWED_ORIGINS
      value: https://lumi-dashboard.ansatt.dev.nav.no
