apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: lumi-api
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  port: 8080
  replicas:
    min: 2
    max: 4
  liveness:
    path: /internal/isAlive
    initialDelay: 30
  readiness:
    path: /internal/isReady
    initialDelay: 30
  prometheus:
    enabled: true
    path: /internal/prometheus
  resources:
    limits:
      memory: 1024Mi
    requests:
      cpu: 200m
      memory: 512Mi
  observability:
    logging:
      destinations:
        - id: elastic
        - id: loki
    autoInstrumentation:
      enabled: true
      runtime: java
  tokenx:
    enabled: true
  azure:
    application:
      enabled: true
      allowAllUsers: true
      tenant: nav.no
      claims:
        extra:
          - "NAVident"
  accessPolicy:
    inbound:
      rules:
        - application: lumi-dashboard
        - application: dialogmote-frontend
          namespace: team-esyfo
        - application: bro-frontend
        - application: syfo-oppfolgingsplan-frontend
        - application: narmesteleder-frontend
        - application: dinesykmeldte
        - application: syfomodiaperson
          namespace: teamsykefravr
        - application: oppfolgingsplan-frontend
    outbound:
      external:
        - host: console.nav.cloud.nais.io
  gcp:
    # BigQuery export (ADR 0007): load jobs run in the team project. Teams give
    # Lumi access to their own dataset, so no dataset roles are granted here.
    permissions:
      - resource:
          apiVersion: resourcemanager.cnrm.cloud.google.com/v1beta1
          kind: Project
        role: roles/bigquery.jobUser
    sqlInstances:
      - type: POSTGRES_17
        tier: db-custom-1-3840
        diskAutoresize: true
        highAvailability: false
        # Cloud SQL maintenance window in UTC: Sunday 01:00-02:00, which is
        # 03:00 Oslo time in summer and 02:00 in winter.
        maintenance:
          day: 7
          hour: 1
        flags:
          - name: "cloudsql.enable_pgaudit"
            value: "on"
          - name: "pgaudit.log"
            value: "write,ddl,role"
        databases:
          - name: lumi
            envVarPrefix: DB
  valkey:
    - instance: lumi-cache
      access: readwrite
  env:
    - name: NAIS_CLUSTER_NAME
      value: prod-gcp
    - name: LUMI_DASHBOARD_CLIENT_ID
      value: prod-gcp:team-esyfo:lumi-dashboard
    - name: NAIS_API_GRAPHQL_URL
      value: https://console.nav.cloud.nais.io/graphql
    - name: LUMI_CORS_ALLOWED_ORIGINS
      value: https://lumi-dashboard.ansatt.nav.no
    - name: LUMI_GLOBAL_REQUESTS_PER_SOURCE_PER_MINUTE
      value: "10000"
    # Automatic deletion of responses older than 12 months, enabled in production since #559.
    # Set to "false" to stop it, see apps/lumi-api/docs/runbooks/automatic-retention.md.
    - name: LUMI_RETENTION_ENABLED
      value: "true"
    # BigQuery export to the teams' own datasets, see docs/adr/0007-teameid-bigquery-eksport.md.
    # The pilot list limits who can set it up. Remove it to open the export for every team.
    - name: LUMI_BIGQUERY_EXPORT_ENABLED
      value: "true"
    - name: LUMI_BIGQUERY_EXPORT_PILOT_TEAMS
      value: "team-esyfo,teamsykefravr"
    # Free text stays closed in production until a team's PVK covers it. Open it per team with
    # LUMI_BIGQUERY_EXPORT_FREE_TEXT_TEAMS, a comma-separated list of teams.
