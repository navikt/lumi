apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lumi-api-definition-conflicts
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  groups:
    - name: lumi-api-definition-conflicts
      rules:
        - alert: LumiSurveyDefinitionConflict
          expr: sum(increase(lumi_survey_definition_conflicts_total{app="lumi-api"}[5m])) > 0
          annotations:
            summary: "Lumi avviser innsendinger på grunn av definisjonskonflikt"
            consequence: "Minst én survey-innsending er avvist med 409 og er ikke lagret."
            action: "Finn team, app og survey_id i de strukturerte loggene og følg runbooken."
            runbook_url: "https://github.com/navikt/lumi/blob/main/apps/lumi-api/docs/runbooks/survey-definition-conflicts.md"
          labels:
            severity: warning
            namespace: team-esyfo
    - name: lumi-api-submission-health
      rules:
        - alert: LumiSubmissionFailure
          expr: sum(increase(lumi_submissions_total{app="lumi-api",outcome="failed"}[5m])) > 0
          annotations:
            summary: "Lumi feiler ved behandling av survey-innsendinger"
            consequence: "Minst én autentisert innsending har feilet med en serverfeil og kan mangle i dashboardet."
            action: "Bryt videre utrulling og følg runbooken for å finne kanal og feil i loggene."
            runbook_url: "https://github.com/navikt/lumi/blob/main/apps/lumi-api/docs/runbooks/submission-health.md"
          labels:
            severity: warning
            namespace: team-esyfo
        - alert: LumiSubmissionRejectionSpike
          expr: >-
            sum by (channel) (increase(lumi_submissions_total{app="lumi-api",outcome="rejected"}[10m])) >= 5
            and
            sum by (channel) (increase(lumi_submissions_total{app="lumi-api",outcome="rejected"}[10m]))
            / clamp_min(sum by (channel) (increase(lumi_submissions_total{app="lumi-api"}[10m])), 1) > 0.1
          annotations:
            summary: "Lumi avviser uvanlig mange survey-innsendinger"
            consequence: "Minst fem innsendinger i én kanal er avvist, og mer enn 10 prosent av kanalens trafikk de siste ti minuttene er berørt."
            action: "Stans nye migreringer, identifiser berørt kanal i Grafana og følg runbooken."
            runbook_url: "https://github.com/navikt/lumi/blob/main/apps/lumi-api/docs/runbooks/submission-health.md"
          labels:
            severity: warning
            namespace: team-esyfo
    - name: lumi-api-retention
      rules:
        - alert: LumiRetentionCleanupFailure
          expr: sum(increase(lumi_retention_runs_total{app="lumi-api",outcome="failed"}[15m])) > 0
          annotations:
            summary: "Automatisk sletting av gamle Lumi-svar feiler"
            consequence: "Survey-svar som har passert lagringstiden kan bli liggende lenger enn 12 måneder."
            action: "Undersøk feilen og kontroller at neste opprydding fullføres."
            runbook_url: "https://github.com/navikt/lumi/blob/main/apps/lumi-api/docs/runbooks/automatic-retention.md"
          labels:
            severity: warning
            namespace: team-esyfo
        - alert: LumiRetentionCleanupStale
          expr: >-
            max(lumi_retention_enabled{app="lumi-api"}) == 1
            and on()
            ((time() - max(max_over_time(lumi_retention_last_success_timestamp_seconds{app="lumi-api"}[36h])) > 129600)
            or on() absent_over_time(lumi_retention_last_success_timestamp_seconds{app="lumi-api"}[15m]))
          for: 15m
          annotations:
            summary: "Automatisk sletting av gamle Lumi-svar har ikke fullført"
            consequence: "Ingen API-instans har rapportert en vellykket opprydding de siste 36 timene."
            action: "Kontroller konfigurasjon, scheduler, database og Prometheus-scraping, og kjør runbooken."
            runbook_url: "https://github.com/navikt/lumi/blob/main/apps/lumi-api/docs/runbooks/automatic-retention.md"
          labels:
            severity: warning
            namespace: team-esyfo
