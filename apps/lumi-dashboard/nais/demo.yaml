apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: lumi-dashboard-demo
  namespace: team-esyfo
  labels:
    team: team-esyfo
spec:
  image: {{image}}
  port: 3000
  replicas:
    min: 1
    max: 2
  liveness:
    path: /api/internal/isAlive
    initialDelay: 20
  readiness:
    path: /api/internal/isReady
    initialDelay: 20
  prometheus:
    enabled: true
    path: /api/internal/metrics
  resources:
    limits:
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi
  ingresses:
    - https://lumi-dashboard-demo.ekstern.dev.nav.no

  env:
    - name: NODE_ENV
      value: production
    - name: USE_MOCK_DATA
      value: "true"
    - name: LUMI_API_URL
      value: "http://localhost"
    - name: LUMI_API_AUDIENCE
      value: "demo-audience"
    # Seconds srvx waits for requests in flight after SIGTERM (default 5).
    # Nais allows 30 s in all, and its preStop sleep takes the first 5.
    - name: SERVER_SHUTDOWN_TIMEOUT
      value: "20"
